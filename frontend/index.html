<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Activewatcher</title>
  </head>
  <body>
    <script>
      try {
        const mode = String(window.localStorage.getItem("aw.ui.theme") || "")
          .trim()
          .toLowerCase();
        const contrast = String(window.localStorage.getItem("aw.ui.contrast") || "")
          .trim()
          .toLowerCase();
        const design = String(window.localStorage.getItem("aw.ui.design") || "")
          .trim()
          .toLowerCase();
        if (mode === "light" || mode === "white") {
          document.body.classList.add("theme-light");
        }
        if (contrast === "high" || contrast === "high-contrast") {
          document.body.classList.add("theme-high-contrast");
        }
        if (design === "terminal") {
          document.body.classList.add("design-terminal");
        }
      } catch {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
